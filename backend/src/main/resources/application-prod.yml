# Production and staging (the Docker image starts with this profile). Secrets come from the platform, never from here.
server:
  # behind the platform's HTTPS proxy: trust X-Forwarded-* to know the request was HTTPS
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
        same-site: lax
logging:
  structured:
    # one JSON line per log entry, for the platform's log search; never log tokens, passwords or personal data
    format:
      console: ecs
spring:
  datasource:
    # no default: a missing value stops the application
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    # Supabase leaves its function rls_auto_enable in the public schema, so Flyway sees a non-empty schema with no
    # history table and refuses to start. Baselining at version 0 creates the history table and still applies V1 onwards.
    baseline-on-migrate: true
    baseline-version: 0
app:
  login-limit:
    # Fly Proxy sets it; when it is absent the real connection address is used, never X-Forwarded-For
    client-ip-header: Fly-Client-IP
  email:
    provider: resend
    resend:
      # secret from the platform (RESEND_API_KEY); blank makes the application refuse to start
      api-key: ${RESEND_API_KEY:}
  storage:
    # the disk provider refuses to start in prod
    provider: supabase
    supabase:
      # project address from the platform (APP_STORAGE_SUPABASE_URL); no default, so a missing value stops the application
      url: ${APP_STORAGE_SUPABASE_URL}
      # secret key from the platform (APP_STORAGE_SUPABASE_SECRET_KEY); blank makes the application refuse to start
      secret-key: ${APP_STORAGE_SUPABASE_SECRET_KEY:}
      # private bucket, created by hand in the Supabase panel
      bucket: product-files
      # private bucket for the product cover images (2 MB, image/png, image/jpeg, image/webp), also created by hand
      cover-bucket: product-covers
  pix:
    # the in-memory fake refuses to start in prod
    provider: asaas
  asaas:
    api:
      # Asaas address from the platform (APP_ASAAS_API_BASE_URL); no default, so a missing value stops the application
      base-url: ${APP_ASAAS_API_BASE_URL}
      # secret from the platform (APP_ASAAS_API_KEY); blank makes the application refuse to start
      key: ${APP_ASAAS_API_KEY:}
  admin:
    # a blank or invalid APP_ADMIN_EMAIL stops the application
    required: true
  # public site address from the platform (APP_PUBLIC_BASE_URL); no default, so a missing value stops the application
  public-base-url: ${APP_PUBLIC_BASE_URL}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
