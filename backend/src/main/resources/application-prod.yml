# Production and staging (the Docker image starts with this profile). Secrets come from the platform, never from here.
server:
  # behind the platform's HTTPS proxy: trust X-Forwarded-* to know the request was HTTPS
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
        same-site: lax
logging:
  structured:
    # one JSON line per log entry, for the platform's log search; never log tokens, passwords or personal data
    format:
      console: ecs
app:
  email:
    provider: resend
    resend:
      # secret from the platform (RESEND_API_KEY); blank makes the application refuse to start
      api-key: ${RESEND_API_KEY:}
  admin:
    # a blank or invalid APP_ADMIN_EMAIL stops the application
    required: true
    # no panel login until MFA (#15, ADR-0004); only the CI e2e switches it on (APP_ADMIN_PANEL_LOGIN_ENABLED=true)
    panel-login-enabled: false
  # public site address from the platform (APP_PUBLIC_BASE_URL); no default, so a missing value stops the application
  public-base-url: ${APP_PUBLIC_BASE_URL}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
