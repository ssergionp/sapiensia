# API port: scripts/escolher-portas.ps1 gives each project its own (8081 and up).
server:
  port: 8081
  servlet:
    session:
      # idle timeout (SEC-005); the session lives in server memory, so a restart logs everyone out
      timeout: 2h
      cookie:
        http-only: true
spring:
  servlet:
    multipart:
      # 50 MB per file (52,428,800 bytes) and 51 MB per request: Tomcat cuts the body while receiving (SEC-043).
      # file-size-threshold 0 writes the part straight to disk; resolve-lazily lets the controller answer 413.
      max-file-size: 50MB
      max-request-size: 51MB
      file-size-threshold: 0
      resolve-lazily: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/app}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    deserialization:
      # Without this, 1.5 would be silently truncated to 1 in integer fields.
      accept-float-as-int: false
    mapper:
      # Without this, 123 would be accepted as the text "123" and "10" as the number 10.
      allow-coercion-of-scalars: false
    datatype:
      enum:
        # Without this, the number 0 would select the first enum constant.
        fail-on-numbers-for-enums: true
management:
  endpoints:
    web:
      # health check under /api, like every other route (the Vite proxy and the deploy both rely on that)
      base-path: /api/system
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
logging:
  level:
    # at DEBUG/TRACE this logs the typed e-mail ("Failed to find user '<e-mail>'"), forbidden by ADR-0006
    org.springframework.security.authentication.dao.DaoAuthenticationProvider: INFO
    # PDFBox warnings can quote parts of the uploaded file; keep only errors (SEC-046)
    org.apache.pdfbox: ERROR
  pattern:
    # the correlation ID of the request (CorrelationIdFilter) on every console line; the prod JSON format has it as an MDC field
    correlation: "[%X{correlationId:-}] "
app:
  email:
    from: "SapiensIA <nao-responda@sapiensia.app.br>"
    # where the "file" provider writes e-mails (relative to backend/); APP_EMAIL_OUTBOX_DIR overrides it
    outbox-dir: ${APP_EMAIL_OUTBOX_DIR:../.tmp/outbox}
    # a failing e-mail task is tried this many times in total, once every retry-delay, then dropped
    max-attempts: 5
    retry-delay: PT5M
  storage:
    # where the product files go: "file" (local disk, never in prod) or "supabase" (the prod profile sets it)
    provider: file
    file:
      # directory of the "file" provider (relative to backend/); APP_STORAGE_FILE_DIR overrides it
      dir: ${APP_STORAGE_FILE_DIR:../.tmp/storage}
  # site address used in e-mail links (no trailing slash); no default: a missing value stops the application
  public-base-url: ${APP_PUBLIC_BASE_URL}
  email-confirmation:
    ttl: PT24H
  password-reset:
    ttl: PT30M
  unconfirmed-customer:
    # accounts whose e-mail stays unconfirmed longer than this (from creation) are deleted by the daily cleanup
    retention: P7D
  admin:
    # e-mail of the single Administrator, created on first startup (secret APP_ADMIN_EMAIL); there is no initial password
    email: ${APP_ADMIN_EMAIL:}
    # validity of the set-password link, and the minimum time between two first-access e-mails
    password-link-ttl: PT24H
    password-link-min-interval: PT1H
    # true (prod only): a blank or invalid e-mail stops the application
    required: false
    # how long the "MFA pending" state lasts after the correct password; then the code is refused and the login restarts
    mfa-pending-ttl: PT5M
    # how long a password and code typed again (or the login) count as recent, for the actions that ask for it
    reauthentication-window: PT5M
  audit:
    # audit events older than this are deleted by the daily cleanup; never below P365D (the database trigger floor)
    retention: P365D
  mfa:
    # Base64 of 32 bytes (secret APP_MFA_ENCRYPTION_KEY); no default, so a missing or invalid value stops the application
    encryption-key: ${APP_MFA_ENCRYPTION_KEY}
  login-limit:
    # failed logins per account within account-window lock that account for account-lock
    account-max-failures: 5
    account-window: PT15M
    account-lock: PT15M
    # login attempts per client IP within ip-window
    ip-max-attempts: 20
    ip-window: PT15M
    # request header carrying the client IP; blank uses the socket address (set only a header the platform overwrites)
    client-ip-header:
  asaas:
    webhook:
      # shared secret sent by Asaas in the asaas-access-token header (secret APP_ASAAS_WEBHOOK_TOKEN); a missing or
      # invalid value stops the application
      token: ${APP_ASAAS_WEBHOOK_TOKEN}
      # official Asaas source IPs, from https://docs.asaas.com/docs/official-asaas-ips (checked on 2026-11-11);
      # APP_ASAAS_WEBHOOK_ALLOWED_IPS replaces the whole list; the sandbox may need an extra IP
      allowed-ips: 52.67.12.206,18.230.8.159,54.94.136.112,54.94.183.101
      # larger request bodies are refused
      max-body-bytes: 65536
  product-file:
    # a PDF with more pages is refused (SEC-043)
    max-pages: 1000
    # the PDF structure check is abandoned after this long (SEC-047)
    validation-timeout: PT20S
  product-cover:
    # an object registered for deletion is only deleted after this long, so an upload in progress is never touched
    orphan-min-age: PT15M
