spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed
db-scheduler:
  # Poll every second so the e-mail jobs go out quickly in local development
  polling-interval: 1s
app:
  email:
    provider: file
  admin:
    email: admin@example.com
  mfa:
    # fictitious key (32 identical bytes), local profile only: never a real secret, and prod has no default
    encryption-key: ${APP_MFA_ENCRYPTION_KEY:QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE=} # gitleaks:allow
  # Vite dev server (default port), which serves the frontend pages
  public-base-url: http://localhost:5173
  # The e2e tests run against this profile and make every login from one IP
  login-limit:
    ip-max-attempts: 1000