# Test-only values. A .properties file adds to the main application.yml instead of replacing it.
# Short intervals so background e-mail tasks and their retries run within the tests' timeouts.
db-scheduler.polling-interval=1s
app.email.retry-delay=PT1S
app.public-base-url=http://localhost:5173
app.password-reset.ttl=PT30M
app.login-limit.account-max-failures=5
app.login-limit.account-window=PT15M
app.login-limit.account-lock=PT15M
app.login-limit.ip-max-attempts=20
app.login-limit.ip-window=PT15M
app.login-limit.client-ip-header=
app.admin.email=admin@example.com
app.admin.password-link-ttl=PT24H
app.admin.password-link-min-interval=PT1H
app.admin.required=false
app.admin.mfa-pending-ttl=PT5M
# Fictitious key (32 identical bytes), for tests only.
app.mfa.encryption-key=QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE=
app.audit.retention=P365D
