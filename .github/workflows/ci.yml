name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  # format, lint, unit and integration tests, build (the same as just check)
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.59.0'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: just setup
      - run: .github/ci-report.sh "just check" just check

  # the Docker image against a real database, end-to-end tests in a browser, and a scan of the image
  e2e:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: .github/ci-report.sh "Docker build" docker build -t app:ci .
      # prod requires Supabase Storage; this stub stands in for it (the secret below is fake)
      - name: Start the Storage stub
        run: |
          nohup node .github/supabase-storage-stub.mjs 54321 > "$RUNNER_TEMP/storage-stub.log" 2>&1 &
          for i in $(seq 1 20); do
            curl -s -o /dev/null http://127.0.0.1:54321/ && exit 0
            sleep 0.5
          done
          cat "$RUNNER_TEMP/storage-stub.log"
          exit 1
      # prod requires the Asaas API; this stub stands in for it (the key below is fake)
      - name: Start the Asaas stub
        run: |
          nohup node .github/asaas-stub.mjs 54322 > "$RUNNER_TEMP/asaas-stub.log" 2>&1 &
          for i in $(seq 1 20); do
            curl -s -o /dev/null http://127.0.0.1:54322/ && exit 0
            sleep 0.5
          done
          cat "$RUNNER_TEMP/asaas-stub.log"
          exit 1
      # APP_LOGIN_LIMIT_IP_MAX_ATTEMPTS and APP_RATE_LIMIT_IP_CAPACITY_FLOOR are raised because all e2e requests come
      # from one IP.
      - name: Start the system
        run: |
          MFA_KEY="$(openssl rand -base64 32)"
          echo "::add-mask::$MFA_KEY"
          ASAAS_WEBHOOK_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$ASAAS_WEBHOOK_TOKEN"
          echo "E2E_ASAAS_WEBHOOK_TOKEN=$ASAAS_WEBHOOK_TOKEN" >> "$GITHUB_ENV"
          mkdir -p .tmp/outbox && chmod 777 .tmp/outbox
          docker run -d --name app --network host \
            -v "$PWD/.tmp/outbox:/outbox" \
            -e APP_EMAIL_PROVIDER=file -e APP_EMAIL_OUTBOX_DIR=/outbox \
            -e APP_PUBLIC_BASE_URL=http://localhost:8080 \
            -e APP_ADMIN_EMAIL=admin-e2e@example.com \
            -e APP_MFA_ENCRYPTION_KEY="$MFA_KEY" \
            -e APP_ASAAS_WEBHOOK_TOKEN="$ASAAS_WEBHOOK_TOKEN" \
            -e DB_SCHEDULER_POLLING_INTERVAL=PT1S \
            -e APP_LOGIN_LIMIT_IP_MAX_ATTEMPTS=1000 \
            -e APP_RATE_LIMIT_IP_CAPACITY_FLOOR=10000 \
            -e APP_STORAGE_SUPABASE_URL=http://localhost:54321 \
            -e APP_STORAGE_SUPABASE_SECRET_KEY=ci-fake-secret-not-real \
            -e APP_ASAAS_API_BASE_URL=http://localhost:54322 \
            -e APP_ASAAS_API_KEY=ci-fake-asaas-key-not-real \
            -e DB_URL=jdbc:postgresql://localhost:5432/app -e DB_USER=app -e DB_PASSWORD=app \
            -e SERVER_SERVLET_SESSION_COOKIE_SECURE=false app:ci
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/api/system/health && exit 0
            sleep 2
          done
          docker logs app > app.log 2>&1
          .github/ci-report.sh "The system did not start" tail -n 80 app.log
          exit 1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      # The browser comes from the Playwright CDN, not apt: apt mirrors have been down for hours.
      # apt runs only if Chromium cannot start for lack of system libraries, with 3 attempts.
      - name: Install Chromium for Playwright
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium
          if node -e "require('@playwright/test').chromium.launch().then((b) => b.close())"; then
            echo "Chromium starts with the runner libraries; apt was not used."
            exit 0
          fi
          echo "Chromium is missing system libraries; installing them with apt."
          for attempt in 1 2 3; do
            if sudo apt-get update && pnpm exec playwright install-deps chromium; then
              echo "System libraries installed on attempt $attempt."
              exit 0
            fi
            [ "$attempt" -lt 3 ] && sleep $((attempt * 30))
          done
          echo "apt failed 3 times."
          exit 1
      - name: End-to-end tests
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_ADMIN_EMAIL: admin-e2e@example.com
        run: ../.github/ci-report.sh "End-to-end tests" pnpm exec playwright test
      # The app is stopped so the row counts cannot change during the test. The test uses a throwaway age key pair
      # and writes only to a temporary directory (nothing under frontend/, nothing uploaded).
      - name: "NFR-008 ADR-0002: backup round trip (dump, encrypt, decrypt, restore, compare)"
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PG_MAJOR: "18"
          PGDATABASE: app
          ADMIN_PGUSER: app
          ADMIN_PGPASSWORD: app
        run: |
          docker stop app
          .github/ci-report.sh "Backup round trip" bash scripts/backup/roundtrip-test.sh
      - name: Logs of the system
        if: failure()
        run: docker logs app
      - name: Report of the end-to-end tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: frontend/.tmp/e2e-report
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.1
      - name: Scan the image (fails on fixable high or critical vulnerabilities)
        run: .github/ci-report.sh "Trivy image" trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress --format template --template "@.github/trivy-summary.tpl" app:ci

  # leaked secrets, vulnerable dependencies, static analysis and the SBOM
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Download the backend dependencies (Trivy reads them from the local Maven cache)
        working-directory: backend
        run: ./mvnw -q -B dependency:go-offline
      - name: Secrets in the code and in the history (gitleaks)
        run: .github/ci-report.sh "gitleaks" docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.1
      - name: Vulnerable dependencies (fails on fixable high or critical)
        run: .github/ci-report.sh "Trivy dependencies" trivy fs --scanners vuln --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress --format template --template "@.github/trivy-summary.tpl" .
      - name: SBOM (list of every dependency, CycloneDX)
        run: trivy fs --format cyclonedx --output sbom.cdx.json --no-progress .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
      - name: Static analysis (Semgrep)
        run: .github/ci-report.sh "Semgrep" .github/semgrep.sh
