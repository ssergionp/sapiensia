version: 2
# One grouped pull request per ecosystem each week, instead of one per dependency.
# cooldown: a version must be 7 days old before it is proposed (a just-published package may be malicious or broken).
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      backend:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      frontend:
        patterns: ["*"]
    ignore:
      # the types follow the Node LTS installed on the computer, not the newest Node
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
