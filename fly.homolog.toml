app = "sapiensia-homolog"
primary_region = "gru"

[env]
  APP_PUBLIC_BASE_URL = "https://sapiensia-homolog.fly.dev"
  APP_EMAIL_FROM = "SapiensIA <nao-responda@homolog.sapiensia.app.br>"
  APP_ASAAS_API_BASE_URL = "https://api-sandbox.asaas.com"
  # replaces the image's value, so MaxRAMPercentage is repeated; C1 only makes the cold start cheaper on a shared CPU
  JAVA_TOOL_OPTIONS = "-XX:MaxRAMPercentage=75 -XX:TieredStopAtLevel=1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/system/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
